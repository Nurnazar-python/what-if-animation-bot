name: Render What-If Animation

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install numpy Pillow requests edge-tts openai-whisper stable-ts google-auth google-api-python-client

      - name: Create telegram notify script
        run: |
          cat > /tmp/notify.py << 'EOF'
          import os, requests, json, sys
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = sys.argv[1]
          text = sys.argv[2]
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': text})
          EOF

      - name: Send Telegram "Starting"
        run: |
          python /tmp/notify.py '${{ github.event.client_payload.chat_id }}' '🎬 Starting video creation...'

      - name: Generate script & voice
        run: |
          python scripts/voice.py ${{ github.event.client_payload.slug }}
          python scripts/plan.py ${{ github.event.client_payload.slug }}

      - name: Send Telegram "Voice Ready"
        run: |
          python /tmp/notify.py '${{ github.event.client_payload.chat_id }}' '✅ voice.mp3 ready'

      - name: Render storyboard stills
        run: |
          npx remotion still src/index.ts Cast out/cast.png
          node scripts/stills.mjs ${{ github.event.client_payload.slug }}
          python scripts/board.py ${{ github.event.client_payload.slug }}

      - name: Send Telegram "Storyboard Ready"
        run: |
          python /tmp/notify.py '${{ github.event.client_payload.chat_id }}' '✅ Storyboard rendered, starting animation...'

      - name: Animate & render video
        run: |
          python scripts/master.py ${{ github.event.client_payload.slug }}

      - name: Send Telegram "Video Ready"
        run: |
          python /tmp/notify.py '${{ github.event.client_payload.chat_id }}' '✅ Animation complete, uploading to YouTube...'

      - name: Create youtube upload script
        run: |
          cat > /tmp/upload_youtube.py << 'EOF'
          import os, google.auth.transport.requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token'
          )
          creds.refresh(google.auth.transport.requests.Request())

          youtube = build('youtube', 'v3', credentials=creds)

          slug = os.environ['SLUG']
          video_path = f'studio/out/{slug}/{slug}-final.mp4'

          request_body = {
              'snippet': {
                  'title': os.environ['TITLE'],
                  'description': 'Generated by What-If Animation Bot',
                  'tags': ['what-if', 'animation', 'ai-generated'],
                  'categoryId': '24'
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False
              }
          }

          media = MediaFileUpload(video_path, chunksize=-1, resumable=True, mimetype='video/mp4')
          response = youtube.videos().insert(part='snippet,status', body=request_body, media_body=media).execute()
          print(f'VIDEO_ID={response["id"]}')
          EOF

      - name: Upload to YouTube
        id: youtube
        env:
          SLUG: ${{ github.event.client_payload.slug }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          python /tmp/upload_youtube.py >> $GITHUB_OUTPUT

      - name: Send Telegram "Done with YouTube Link"
        run: |
          python /tmp/notify.py '${{ github.event.client_payload.chat_id }}' '🎉 Done! https://youtu.be/${{ steps.youtube.outputs.VIDEO_ID }}'