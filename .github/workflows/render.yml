name: Render What-If Animation

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install numpy Pillow requests edge-tts openai-whisper stable-ts

      - name: Send Telegram "Starting"
        run: |
          python -c "
import os, requests, json
data = {'chat_id': '${{ github.event.client_payload.chat_id }}', 'text': '🎬 Starting video creation...'}
requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage', json=data)
          "

      - name: Generate script & voice
        id: generate
        run: |
          python scripts/voice.py ${{ github.event.client_payload.slug }}
          python scripts/plan.py ${{ github.event.client_payload.slug }}
        working-directory: ./studio

      - name: Send Telegram "Voice Ready"
        run: |
          python -c "
import os, requests, json
data = {'chat_id': '${{ github.event.client_payload.chat_id }}', 'text': '✅ voice.mp3 ready'}
requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage', json=data)
          "

      - name: Render storyboard stills
        run: |
          npx remotion still src/index.ts Cast out/cast.png
          node scripts/stills.mjs ${{ github.event.client_payload.slug }}
          python scripts/board.py ${{ github.event.client_payload.slug }}
        working-directory: ./studio

      - name: Send Telegram "Storyboard Ready"
        run: |
          python -c "
import os, requests, json
data = {'chat_id': '${{ github.event.client_payload.chat_id }}', 'text': '✅ Storyboard rendered, starting animation...'}
requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage', json=data)
          "

      - name: Animate & render video
        run: |
          python scripts/master.py ${{ github.event.client_payload.slug }}
        working-directory: ./studio

      - name: Send Telegram "Video Ready"
        run: |
          python -c "
import os, requests, json
data = {'chat_id': '${{ github.event.client_payload.chat_id }}', 'text': '✅ Animation complete, uploading to YouTube...'}
requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage', json=data)
          "

      - name: Upload to YouTube
        id: youtube
        run: |
          python -c "
import os, requests, json, google.auth.transport.requests
from google.oauth2.credentials import Credentials
from googleapiclient.discovery import build
from googleapiclient.http import MediaFileUpload

creds = Credentials(
    token=None,
    refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
    client_id=os.environ['YOUTUBE_CLIENT_ID'],
    client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
    token_uri='https://oauth2.googleapis.com/token'
)
creds.refresh(google.auth.transport.requests.Request())

youtube = build('youtube', 'v3', credentials=creds)

video_path = f'studio/out/${{ github.event.client_payload.slug }}/${{ github.event.client_payload.slug }}-final.mp4'

request_body = {
    'snippet': {
        'title': '${{ github.event.client_payload.title }}',
        'description': 'Generated by What-If Animation Bot',
        'tags': ['what-if', 'animation', 'ai-generated'],
        'categoryId': '24'
    },
    'status': {
        'privacyStatus': 'public',
        'selfDeclaredMadeForKids': False
    }
}

media = MediaFileUpload(video_path, chunksize=-1, resumable=True, mimetype='video/mp4')
response = youtube.videos().insert(part='snippet,status', body=request_body, media_body=media).execute()
video_id = response['id']
print(f'VIDEO_ID={video_id}')
          " >> $GITHUB_OUTPUT

      - name: Send Telegram "Done with YouTube Link"
        run: |
          python -c "
import os, requests, json
video_id = '${{ steps.youtube.outputs.VIDEO_ID }}'
url = f'https://youtu.be/{video_id}'
text = f'🎉 Done! {url}'
data = {'chat_id': '${{ github.event.client_payload.chat_id }}', 'text': text}
requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage', json=data)
          "